<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Hintergrund-Farbverlauf (Sehr dunkles Blau-Grau) -->
    <linearGradient id="bgGradVar4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Haupt-Akzentfarbe für das Icon (Digitales Blau) -->
    <linearGradient id="iconGradVar4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    
    <!-- Leuchteffekt-Filter für den Kern -->
    <filter id="glowVar4" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="6" result="coloredBlur" />
        <feMerge>
            <feMergeNode in="coloredBlur" />
            <feMergeNode in="SourceGraphic" />
        </feMerge>
    </filter>
  </defs>

  <!-- Quadratischer App-Container -->
  <rect width="200" height="200" rx="40" fill="url(#bgGradVar4)" />

  <!-- === ICON BEREICH (Zentriert) === -->
  <g transform="translate(40, 40)">
    
    <!-- Äußerer gestrichelter Ring (Virtuelle Abgrenzung) -->
    <circle cx="60" cy="60" r="55" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.7" />

    <!-- Mittlere Umlaufbahnen (Datendurchfluss) -->
    <g stroke="url(#iconGradVar4)" stroke-width="2" fill="none" opacity="0.9">
        <!-- Ellipse 1 (Horizontal) -->
        <ellipse cx="60" cy="60" rx="60" ry="30" transform="rotate(-45 60 60)" />
        <!-- Ellipse 2 (Vertikal) -->
        <ellipse cx="60" cy="60" rx="60" ry="30" transform="rotate(45 60 60)" />
    </g>

    <!-- Zentraler Kern / "FARO" Leuchtpunkt (Der Fokus) -->
    <g filter="url(#glowVar4)">
        <!-- Äußerer Glüh-Ring -->
        <circle cx="60" cy="60" r="24" fill="url(#iconGradVar4)" opacity="0.3" />
        <!-- Innerer Kern-Punkt -->
        <circle cx="60" cy="60" r="10" fill="#ffffff" />
        <!-- Subtiler Highlight-Punkt -->
        <circle cx="56" cy="56" r="3" fill="#ffffff" opacity="0.9" />
    </g>
  </g>
  
    <!-- Kleine technische Abschluss-Details -->
    <rect x="10" y="10" width="180" height="180" rx="30" fill="none" stroke="#334155" stroke-width="0.5" />
    <circle cx="100" cy="10" r="2" fill="#475569" />
    <circle cx="100" cy="190" r="2" fill="#475569" />

</svg>