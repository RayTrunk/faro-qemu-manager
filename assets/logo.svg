<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <title>FARO QEMU MANAGER</title>
  <!--
    A machine inside a machine. The frame behind is open, so whatever the
    mark sits on shows through it and the logo belongs to the dark theme
    and the light one alike; the screen in front is solid, so it reads as
    being in front. No glow and no gradient: at sixteen points a lit centre
    is all anyone sees, which is what the mark before this one suffered
    from.

    Geometry in a 100 unit box -- the same numbers logo.png and icon.ico
    are drawn from.
  -->
  <rect x="15" y="21" width="50" height="35" rx="9"
        fill="none" stroke="#3884ff" stroke-width="8" />
  <rect x="33" y="40" width="56" height="43" rx="13" fill="#7dd3fc" />
  <rect x="41" y="48" width="40" height="27" rx="8" fill="#002fa7" />
  <rect x="47" y="55" width="28" height="13" rx="4" fill="#7dd3fc" />
</svg>
